[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorprep"
version = "2.0.0"
description = "Embedding preprocessing (L2, min-max, int8 quantisation, PCA) in NumPy with an optional C++ backend."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Cyb0rg137ms" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "matplotlib>=3.8"]

[project.scripts]
vectorprep = "vectorprep.cli:main"

[tool.setuptools.packages.find]
include = ["vectorprep*"]

[tool.setuptools.package-data]
vectorprep = ["csrc/*.cpp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
