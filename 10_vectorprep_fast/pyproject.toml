[tool.poetry]
name = "vectorprep-fast"
version = "1.0.0"
description = "High-performance C++ Data Preprocessing Core with NumPy Fallback wrappers"
authors = ["Software & AI Developer"]
readme = "README.md"
packages = [{include = "vectorprep"}]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
